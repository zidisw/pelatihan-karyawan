services:
  # ==========================================
  # Laravel Web Service (Docker)
  # ==========================================
  - type: web
    name: pelatihan-karyawan
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Sistem Pelatihan Karyawan"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: pelatihan-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEEDERS
        value: "true" # Jalankan seeder pada deployment pertama (bisa diubah ke false setelahnya)
      - key: FORCE_HTTPS
        value: "true"

# ==========================================
# Managed PostgreSQL Database (Free Tier)
# ==========================================
databases:
  - name: pelatihan-db
    plan: free
    region: singapore
    databaseName: pelatihan_karyawan
    user: laravel_user
